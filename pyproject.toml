[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "manthey-precommit-hooks"
version = "0.2.0"
description = "Clean, zero-overhead pre-commit hooks for AI-generated code."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.scripts]
agent-reformat = "hooks.agent_reformat:run"

[tool.setuptools.packages.find]
where = ["."]
included = ["hooks"]

[tool.agent-reformat]
rules = ["AR011", "AR012"]

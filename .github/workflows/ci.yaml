# GitHub Actions workflow for pre-commit hooks CI/CD
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run weekly on Mondays at midnight UTC to catch dependency issues
    - cron: '0 0 * * 1'
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

env:
  PYTHON_MIN_VER: "3.9"
  PYTHON_MAX_VER: "3.13"

jobs:
  validate-precommit-config:
    name: Validate .pre-commit-hooks.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: pip install pre-commit

      - name: Validate hook definitions
        # This ensures the YAML parses correctly and all referenced files exist
        run: |
          pre-hooks=$(yq e '.[].id' .pre-commit-hooks.yaml)
          for hook in $pre-hooks; do
            entry=$(yq ".[] | select(. id == \"$hook\") | .entry" .pre-commit-hooks.yaml)
            echo "Checking hook: $hook (entry: $entry)"
            # Verify all referenced paths exist
            if [[ "$entry" == hooks/* ]]; then
              script_path=$(echo "$entry" | awk '{print $1}')
              if [ ! -f "$script_path" ]; then
                echo "::error::Referenced hook file '$script_path' not found!"
                exit 1
              fi
            fi
          done
          # Also try parsing it with pre-commit directly
          pre-commit sample-config > /dev/null && \
            echo "YAML is valid YAML" || \
            exit 1

  test-hooks:
    name: Test hooks on Python ${{ matrix.python-version }}
    needs: validate-precommit-config
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Create test Python file
        run: |
          cat > /tmp/test_script.py << 'EOF'
          #!/usr/bin/env python3
          class _TestClass:  # Should have leading underscore removed
              def __init__(self, _value):  # Same here
                  self._value = _value


              def _get_value(self) -> int:  # And here
                  return self._value
          EOF

      - name: Run trim-underscores hook
        run: |
          python hooks/trim_underscores.py \
            --remove-underscores \
            --remove-blank-lines \
            /tmp/test_script.py

      - name: Verify underscores were removed
        run: |
          # The class name should no longer start with underscore
          if grep -q "^[[:space:]]*class _TestClass:" /tmp/test_script.py; then
            echo "::error::_TestClass still has leading underscore!"
            exit 1
          fi

      - name: Verify blank lines were cleaned up
        run: |
          # Original file had double blanks between __init__ and method body
          # After running the hook, consecutive blank lines should be reduced
          echo "Hook ran successfully"

  build-and-test-pyproject:
    name: Build package (source distribution)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Use latest stable Python for build tooling
          python-version: "3.12"
      - name: Install build tools
        run: pip install build twine check-wheel-content
      - name: Check if pyproject.toml exists and build
        run: |
          if [ -f pyproject.toml ]; then
            echo "Building with pyproject.toml..."
            python -m build
            # If wheel is created, verify content
            if ls dist/*.whl 1> /dev/null 2>&1; then
              echo "Verifying wheel contents..."
              check-wheel-content dist/*.whl || true
            fi
          else
            echo "No pyproject.toml found—skipping build test."
          fi

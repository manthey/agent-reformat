# pre-commit hooks configuration file
# https://pre-commit.com for more info

- id: trim-underscores
  name: Trim leading underscores from generated Python code
  description: Remove single leading underscores from Python identifiers generated by LLMs. Also removes excessive blank lines. Use sparingly and review changes!
  entry: hooks/trim_underscores.py --remove-underscores --remove-blank-lines
  language: python
  files: \.py$
  require_serial: false
  additional_dependencies: []

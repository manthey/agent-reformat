[tox]
envlist = py311, py312, py313, py314
minversion = 4.0
isolated_build = true

[testenv]
description = Run the test suite with coverage
deps =
    pytest
    pytest-cov
commands =
    pytest {posargs:tests} --cov=hooks.agent_reformat --cov=hooks.rules --cov-report=xml:.tox/coverage.xml --cov-report=term-missing
